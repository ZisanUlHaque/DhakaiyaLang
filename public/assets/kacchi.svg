<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C05621" />
      <stop offset="40%" stop-color="#DD6B20" />
      <stop offset="100%" stop-color="#7B341E" />
    </linearGradient>
    <linearGradient id="riceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF089" />
      <stop offset="50%" stop-color="#ECC94B" />
      <stop offset="100%" stop-color="#D69E2E" />
    </linearGradient>
    <filter id="steamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Steam Wafts -->
  <path d="M 150,110 Q 130,70 160,30 Q 180,10 160,-10" fill="none" stroke="#ED8936" stroke-width="4" stroke-linecap="round" opacity="0.6" filter="url(#steamGlow)" />
  <path d="M 200,100 Q 220,60 190,20 Q 170,-5 200,-30" fill="none" stroke="#F6AD55" stroke-width="5" stroke-linecap="round" opacity="0.7" filter="url(#steamGlow)" />
  <path d="M 250,110 Q 270,70 240,30 Q 220,10 240,-10" fill="none" stroke="#ED8936" stroke-width="4" stroke-linecap="round" opacity="0.6" filter="url(#steamGlow)" />

  <!-- Degchi (Handi Pot) Body -->
  <ellipse cx="200" cy="140" rx="130" ry="25" fill="#7B341E" stroke="#FFD700" stroke-width="3" />
  <path d="M 70,140 C 60,240 100,285 200,285 C 300,285 340,240 330,140 Z" fill="url(#potGrad)" stroke="#FFD700" stroke-width="3" />
  
  <!-- Brass Rim Collar & Tied Cloth / Atta Seal (Dum Pukht) -->
  <ellipse cx="200" cy="135" rx="126" ry="18" fill="#FBD38D" stroke="#D69E2E" stroke-width="2" />
  <ellipse cx="200" cy="130" rx="115" ry="14" fill="url(#riceGrad)" />

  <!-- Golden Saffron Rice Grains & Meat chunks -->
  <ellipse cx="160" cy="130" rx="25" ry="10" fill="#ED8936" />
  <ellipse cx="230" cy="128" rx="30" ry="12" fill="#DD6B20" />
  <ellipse cx="195" cy="126" rx="20" ry="8" fill="#C53030" /> <!-- Spiced Mutton piece -->
  <circle cx="215" cy="122" r="7" fill="#F6E05E" /> <!-- Golden Saffron Potato -->

  <!-- Handi Decorative Floral Band (Traditional Clay Inlay) -->
  <path d="M 90,210 Q 200,245 310,210" fill="none" stroke="#FFD700" stroke-width="3" stroke-dasharray="8,6" />
  <circle cx="150" cy="225" r="5" fill="#FFD700" />
  <circle cx="200" cy="230" r="7" fill="#FF3366" />
  <circle cx="250" cy="225" r="5" fill="#FFD700" />

  <!-- Brass Handles -->
  <path d="M 68,160 Q 40,165 48,190 Q 55,205 76,195" fill="none" stroke="#FFD700" stroke-width="6" stroke-linecap="round" />
  <path d="M 332,160 Q 360,165 352,190 Q 345,205 324,195" fill="none" stroke="#FFD700" stroke-width="6" stroke-linecap="round" />

  <!-- Pedestal Base -->
  <ellipse cx="200" cy="285" rx="80" ry="12" fill="#4A1D0E" stroke="#FFD700" stroke-width="2" />
</svg>
